<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wtv overlay</title>
  </head>
  <body>
    <div id="stage">
      <div class="layer" id="layer-a"></div>
      <div class="layer" id="layer-b"></div>
    </div>
    <div id="prompt" hidden>
      <div id="prompt-buttons" class="prompt-buttons">
        <button id="prompt-start" type="button" class="big">▶ Start</button>
        <button id="prompt-next" type="button">Next ⏭</button>
      </div>
      <p id="prompt-status" aria-live="polite"></p>
    </div>
    <div id="seek-band" title="Click to jump here"></div>
    <div id="badge" hidden></div>
    <button id="pill" type="button" hidden title="Show the pictures again for this ad">Show pictures</button>
    <button id="dismiss" type="button" hidden title="Hide pictures for this ad" aria-label="Hide pictures for this ad">✕</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
